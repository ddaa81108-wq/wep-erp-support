name: Verify application
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npx playwright install chromium
      - run: npm run build
      - run: npm run check
      - run: npm run test:coverage
      - run: npm run test:restore
      - run: npm run test:ui
      - run: npm run test:settings-requests-ui
      - run: npm run test:ledger-focus-ui
      - run: npm run test:zero-review-ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: verification-failure
          path: artifacts/
          retention-days: 7

  specialized-ui:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        script: [test:realtime, test:collections-ui, test:treasury-ui, test:push-ui, test:notifications-ui, test:monitor-ui, test:activity-ui, test:languages-ui, test:network-efficiency-ui, test:notification-sync-ui, test:collection-exceptional-close-ui]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run build
      - run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-failure-${{ strategy.job-index }}
          path: artifacts/
          retention-days: 7

  ledger-presentation:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        section: [customers, companies, libyan, egyptian]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run build
      - run: node scripts/test-ledger-ui.mjs ${{ matrix.section }}
